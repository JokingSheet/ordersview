name: Build mod
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: gradle build
        working-directory: ordertrend
      - uses: actions/upload-artifact@v4
        with:
          name: ordertrend-jar
          path: ordertrend/build/libs/ordertrend-*[0-9].jar
